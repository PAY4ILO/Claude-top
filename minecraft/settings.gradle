pluginManagement {
	repositories {
		maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
		// зеркало Maven Central: основной адрес иногда отвечает 429
		maven { url = 'https://repo1.maven.org/maven2/' }
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Сам скачивает нужную Java (25), если на компьютере стоит другая.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'lwl-mods'
include 'lwl-skins', 'lwl-auth'
